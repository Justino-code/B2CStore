<svg xmlns="http://www.w3.org/2000/svg" width="240" height="70" viewBox="0 0 240 70">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Ícone moderno minimalista -->
  <g transform="translate(20, 15)">
    <!-- Base do carrinho -->
    <path d="M5 15 L12 15 L15 28 L32 28 L35 15 L12 15 Z" 
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="2.5" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
    
    <!-- Alça do carrinho -->
    <path d="M12 15 L12 12 L15 12 L15 15" 
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="2.5" 
          stroke-linecap="round"/>
    
    <!-- Rodas modernas -->
    <circle cx="14" cy="32" r="3" fill="url(#mainGradient)" opacity="0.9"/>
    <circle cx="30" cy="32" r="3" fill="url(#mainGradient)" opacity="0.9"/>
    
    <!-- Itens no carrinho -->
    <circle cx="20" cy="22" r="2" fill="url(#mainGradient)" opacity="0.7"/>
    <circle cx="25" cy="20" r="1.5" fill="url(#mainGradient)" opacity="0.5"/>
  </g>

  <!-- Texto com tipografia moderna -->
  <text x="55" y="42" font-family="'Poppins', sans-serif" font-size="24" fill="#1e293b" font-weight="700" letter-spacing="0.5">
    b2c
    <tspan fill="url(#mainGradient)" font-weight="800">Store</tspan>
  </text>

  <!-- Tagline sutil -->
  <text x="55" y="58" font-family="'Poppins', sans-serif" font-size="12" fill="#64748b" font-weight="500" letter-spacing="0.3">
    compras online
  </text>
</svg>